name: SkillLink CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bootstrap contract
        run: |
          test -s PROJECT_BRIEF.md
          test -s TEAM_WORKFLOW.md

  quality:
    if: ${{ hashFiles('pyproject.toml') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked --group dev
      - name: Compile
        run: uv run python -m compileall app scripts tests
      - name: Lint
        run: uv run ruff check app scripts tests
      - name: Format check
        run: uv run ruff format --check app scripts tests
      - name: Test
        run: uv run pytest -q
      - name: Golden smoke
        run: uv run python scripts/golden_smoke.py
