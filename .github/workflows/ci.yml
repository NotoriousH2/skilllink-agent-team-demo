name: SkillLink CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bootstrap contract
        run: |
          test -s PROJECT_BRIEF.md
          test -s TEAM_WORKFLOW.md

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect implementation
        id: implementation
        shell: bash
        run: |
          if [[ -f pyproject.toml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.implementation.outputs.present == 'true'
      - name: Install
        if: steps.implementation.outputs.present == 'true'
        run: uv sync --locked --group dev
      - name: Compile
        if: steps.implementation.outputs.present == 'true'
        run: uv run python -m compileall app scripts tests
      - name: Lint
        if: steps.implementation.outputs.present == 'true'
        run: uv run ruff check app scripts tests
      - name: Format check
        if: steps.implementation.outputs.present == 'true'
        run: uv run ruff format --check app scripts tests
      - name: Test
        if: steps.implementation.outputs.present == 'true'
        run: uv run pytest -q
      - name: Golden smoke
        if: steps.implementation.outputs.present == 'true'
        run: uv run python scripts/golden_smoke.py
